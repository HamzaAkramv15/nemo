[package]
name = "nemo-px"
# своя версия, не VERSION шелла: модули (nemo-files, nemo-view, …) берут библиотеку по тегу
# px-vX.Y.Z этого репозитория, и новая версия нужна, только когда меняется то, чем они пользуются
version = "3.2.1"
edition = "2021"
description = "Canvas, styles, fonts, theme and immediate-mode UI shared by the nemo shell and its modules"
license = "MIT"
repository = "https://github.com/HamzaAkramv15/nemo"
publish = false

[features]
# Tiny5 внутри бинаря (+0.4 МБ): модуль в чужой системе рисует пиксельный вид и без установленного шрифта
tiny5 = []

[dependencies]
ab_glyph = "0.2"
unicode-bidi = "0.3"
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = "1"
serde_json = "1"
libc = "0.2"
