[package]
name = "nemo-shell"
version = "3.2.0"
edition = "2021"
publish = false
description = "A lightweight pixel-art Wayland shell for the niri compositor"
readme = "../README.md"
keywords = ["wayland", "niri", "shell", "layer-shell", "desktop"]
categories = ["gui"]
license = "MIT"

[[bin]]
name = "nemo-shell"
path = "src/main.rs"

[features]
# Accessibility (screen reader over AT-SPI) is part of a complete desktop: on by default; it costs disk (about 2 MB of code, paged out), nothing at idle
# (the adapter is created only when a screen reader switches accessibility on and the settings window opens)
default = ["a11y"]
# Package managers own upgrades; disable the CLI/GUI updater and scheduled checks.
package-managed = []
# Screen-reader support: the accessibility tree of the shell windows over AT-SPI (src/a11y.rs).
a11y = ["dep:accesskit", "dep:accesskit_unix"]

[dependencies]
# the drawing library lives here (px/); the modules take it by the tag px-vX.Y.Z of this repository
nemo-px = { path = "px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# blocking 1.7 keeps idle pool threads forever, each waking twice a second (zbus closes sockets
# and reads peer credentials there); 1.6 lets them exit after 500 ms idle
blocking = "=1.6.2"
# экранный диктор: дерево доступности окон шелла через AT-SPI (a11y.rs); за флагом `a11y`, чтобы размер и зависимости были видны отдельно
accesskit = { version = "0.21", optional = true }
accesskit_unix = { version = "0.17", optional = true, default-features = false, features = ["async-io"] }
libc = "0.2"

[workspace]
members = ["dev", "px", "agents"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
