# YAMI // kitty
# included as the last line of kitty.conf: include yami.conf

font_family      Monocraft
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# family and size on the Tiny5/Monocraft pixel grid for this screen (tools/theme.py)
include yami-font.conf
# the shell kitty starts: fish (suggestions from history as you type) when it is installed and
# settings → fonts → terminal has it on; written by yami-shell, empty otherwise
include yami-shell.conf
disable_ligatures always
text_composition_strategy legacy

# frosted glass: kitty is translucent and niri blurs what is behind it (xray blurs the
# wallpaper once and reuses it, so the GPU barely notices)
background_opacity 0.84
background_blur    0
dynamic_background_opacity yes

window_padding_width 8
placement_strategy top-left
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 10
scrollback_lines 10000
repaint_delay 6
input_delay 1
sync_to_monitor yes
enable_audio_bell no
visual_bell_duration 0.08

url_style             straight

# tabs look like the shell buttons
tab_bar_edge          top
tab_bar_style         separator
tab_separator         " ┃ "
tab_title_template    " {index}·{title[:24]} "
active_tab_font_style   bold

# colors follow the shell palette (settings → color), written by tools/theme.py
include yami-colors.conf

# comforts kitty does not turn on by itself
# a desktop notification when a long command ends in a window you are not looking at
# (works with kitty's shell integration, which fish, zsh and bash get)
notify_on_cmd_finish unfocused 30 notify
# the pointer gets out of the way while typing; trailing spaces do not come along on copy
mouse_hide_wait 3.0
strip_trailing_spaces smart
# splits in a window: ctrl+shift+\ side by side, ctrl+shift+- one above the other, ctrl+shift+z
# zooms the current one (and back)
enabled_layouts splits,stack
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+z         toggle_layout stack
# jump between prompts, and read the whole scrollback in a pager
map ctrl+shift+up        scroll_to_prompt -1
map ctrl+shift+down      scroll_to_prompt 1
map ctrl+shift+h         show_scrollback
