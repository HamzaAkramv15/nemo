# nemo: written by nemo-shell (settings → services); edit it there or in nemo-shell.json
# file dialogs come from nemo-files, the screen-share picker from nemo-agents;
# the rest as niri ships it
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=nemo;gtk;
org.freedesktop.impl.portal.ScreenCast=nemo-agents;gnome;
